name: Build administrative data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-admin-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow requests

      - name: Build and validate static JSON
        run: python scripts/build_data.py

      - name: Commit generated data
        shell: bash
        run: |
          if git diff --quiet -- data/admin.json data/source-meta.json 2>/dev/null && git ls-files --error-unmatch data/admin.json >/dev/null 2>&1; then
            echo 'Generated data is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/admin.json data/source-meta.json
          git commit -m 'Build static administrative data'
          git push origin HEAD:main
